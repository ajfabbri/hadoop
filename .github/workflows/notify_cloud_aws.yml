# Add a sticky comment to hadoop-aws PRs from forked repos with a hint that
# integration tests must be manually triggered by a maintainer.
#
name: "Cloud-AWS PR Update"

# Security: This privileged workflow uses pull_request_target but does not
# check out or execute untrusted code. It only creates a check run and a PR
# comment in the base repository.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - 'hadoop-tools/hadoop-aws/**'
      - '.github/workflows/*cloud_aws.yml'
      - '.github/actions/build_image**'
      - '.github/gha-tests/hadoop-aws*excludes.txt'

jobs:
  notify:
    if: github.event.pull_request.head.repo.full_name != github.repository
    name: "Notify Cloud-AWS"
    runs-on: ubuntu-slim
    permissions:
      checks: write
      issues: write
    steps:
      - name: Post approval-required check and sticky comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cloud-aws-fork-pr-note -->';
            const pr = context.payload.pull_request;
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/cloud_aws.yml`;

            const checkSummary = [
              'Cloud-AWS integration tests are not run automatically for fork pull requests.',
              '',
              'A maintainer needs to approve fork workflows and then manually trigger Cloud-AWS:',
              `- Open [Cloud-AWS workflow](${workflowUrl})`,
              `- Run workflow with \`pr_number=${pr.number}\``,
              '',
              `Fork head: \`${pr.head.repo.full_name}@${pr.head.sha.slice(0, 12)}\``,
            ].join('\n');

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Cloud-AWS / Approval Required',
              head_sha: pr.head.sha,
              status: 'completed',
              conclusion: 'action_required',
              output: {
                title: 'Maintainer action required to run Cloud-AWS tests',
                summary: checkSummary,
              },
            });

            const commentBody = [
              marker,
              '### Cloud-AWS integration tests require maintainer action',
              '',
              'This PR comes from a fork, so Cloud-AWS tests are not started automatically.',
              '',
              'A maintainer can run them as follows:',
              '1. Approve workflows for this fork PR if prompted by GitHub.',
              `2. Open [Cloud-AWS workflow](${workflowUrl}) and click **Run workflow**.`,
              `3. Set \`pr_number\` to \`${pr.number}\` (other inputs can stay at defaults).`,
              '',
              `Current fork head: \`${pr.head.repo.full_name}@${pr.head.sha.slice(0, 12)}\``,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              core.info(`Updated sticky comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody,
              });
              core.info(`Created sticky comment ${created.data.id}`);
            }
